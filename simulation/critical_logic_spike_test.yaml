name: "SIGAS-RT critical logic isolated spike test"
version: 1
author: "SIGAS-RT"
steps:
  - set-control:
      part-id: resetBtn
      control: pressed
      value: 0
  - set-control:
      part-id: adcStimZ1
      control: position
      value: 0.1
  - set-control:
      part-id: adcStimZ2
      control: position
      value: 0.1
  - wait-serial: "[BOOT][SIGAS-RT] FreeRTOS integration mode iniciado"
  - wait-serial: "STATE=SYSTEM_NORMAL Z1=NORMAL Z2=NORMAL ACTION=NORMAL"
  - set-control:
      part-id: adcStimZ1
      control: position
      value: 0.9
  - wait-serial: "[SAFETY] HIGH candidate z1=1/3 z2=0/3"
  - set-control:
      part-id: adcStimZ1
      control: position
      value: 0.1
  - delay: 900ms
  - wait-serial: "STATE=SYSTEM_NORMAL Z1=NORMAL Z2=NORMAL ACTION=NORMAL"
